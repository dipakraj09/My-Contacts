<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- main circle -->
  <circle cx="256" cy="256" r="254" fill="url(#bg)"/>

  <!-- white ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="12"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- top gloss -->
  <ellipse cx="256" cy="130" rx="170" ry="92" fill="url(#gloss)"/>

  <!-- letters with soft shadow -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="236" text-anchor="middle" letter-spacing="-6">
    <text x="258" y="338" fill="#022c22" fill-opacity="0.35">DK</text>
    <text x="256" y="332" fill="url(#txt)">DK</text>
  </g>
</svg>
