<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Contacts — Phonebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Deepak Kumar's directory</div>
    <h1>My <em>Contacts</em></h1>
    <p class="count-line"><strong id="visible-count">0</strong> of <span id="total-count">0</span> saved</p>
  </header>

  <div class="search-row">
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="नाम या नंबर से खोजें…" autocomplete="off">
      <button class="clear-btn" id="clear-btn">साफ़ करें</button>
    </div>
  </div>

  <div class="fav-section" id="fav-section">
    <div class="fav-title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      पसंदीदा
    </div>
    <div class="fav-strip" id="fav-strip"></div>
  </div>

  <div id="status" class="status"></div>
  <div id="list"></div>
</div>

<div class="rail" id="rail"></div>
<div class="letter-flash" id="letter-flash"></div>

<script src="script.js" defer></script>
</body>
</html>
